{% load static %}

<!-- Лаунчер чата (кнопка в углу экрана) -->
<div id="ai-chat-launcher" onclick="toggleAIChat()">
    <span>🤖</span>
</div>

<!-- Окно чата -->
<div id="ai-chat-window">
    <div class="ai-chat-header">
        <span>AI-Консультант Electronics</span>
        <span class="ai-chat-close" onclick="toggleAIChat()">×</span>
    </div>

    <div id="ai-chat-messages">
        <div class="ai-message-bot">
            Привет! 👋 Я твой умный ИИ-помощник. Помогу выбрать смартфон, ноутбук или планшет под любые задачи и бюджет. Что тебя интересует?
        </div>
    </div>

    <!-- Индикатор загрузки -->
    <div id="ai-chat-loading">
        🤖 Анализирует каталог...
    </div>

    <!-- CSRF-токен для fetch -->
    {% csrf_token %}

    <div class="ai-chat-footer">
        <input type="text" id="ai-chat-input" placeholder="Напишите ваш запрос..." onkeypress="handleChatKeyPress(event)">
        <button class="ai-chat-send-btn" onclick="sendAIChatMessage()">⚡</button>
    </div>
</div>
