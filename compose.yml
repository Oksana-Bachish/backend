services:
  web:
    build: ./electronics_store
    image: web:1.0.0
    container_name: web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - static_volume:/usr/src/electronics_store/staticfiles
      - ./electronics_store:/usr/src/electronics_store
      - media_volume:/usr/src/electronics_store/media
    restart: unless-stopped # no, always, on-failure: 5
    env_file:
      - ./electronics_store/.env.dev
    depends_on:
      - db
    networks:
      - dev

  db:
    image: postgres:17-bookworm
    container_name: db
    volumes:
      - data:/var/lib/postgresql/data/
    restart: unless-stopped
    env_file:
      - ./electronics_store/.env.dev
    networks:
      - dev

  dbbrowser:
    image: adminer
    container_name: adminer
    ports:
      - 8080:8080
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - dev

  api:
    build: ./api
    image: api:1.0.0
    container_name: api
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - 127.0.0.1:9000:8000
    env_file:
      - ./api/.env.dev
    volumes:
      - ./api:/usr/src/electronics_store
      - ./api/requirements.txt:/usr/src/electronics_store/requirements.txt
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - dev

  fastapi_recommend:
    build:
      context: ../recommend
      dockerfile: Dockerfile
    container_name: local_fastapi_app
    ports:
      - '8085:8000'
    env_file:
      ../recommend/.env.dev
    volumes:
      - ../recommend:/app
    networks:
      - dev

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    env_file:
      - ./electronics_store/.env.dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dev

  celery_worker:
    build: ./electronics_store
    container_name: celery_worker
    command: celery -A electronics_store worker -E --loglevel=info --pool=solo
    env_file:
      - ./electronics_store/.env.dev
    depends_on:
      - db
      - rabbitmq
    volumes:
      - ./electronics_store:/usr/src/electronics_store
    networks:
      - dev

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - dev

volumes:
  data:
  static_volume:
  static_api_volume:
  media_volume:
  rabbitmq_data:
  redis_data:

networks:
  dev: